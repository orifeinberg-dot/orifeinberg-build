<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{TITLE}} — Ori Feinberg</title>
<meta name="description" content="{{SUMMARY}}" />
<link rel="canonical" href="{{URL}}" />
<!-- link previews (LinkedIn, Slack, WhatsApp) -->
<meta property="og:type" content="article" />
<meta property="og:title" content="{{TITLE}} — Ori Feinberg" />
<meta property="og:description" content="{{SUMMARY}}" />
<meta property="og:url" content="{{URL}}" />
<meta property="og:image" content="{{OG_IMAGE}}" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Expanded:wght@600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" />

<!-- Generated by build.mjs from content/projects/<slug>.md — edit the content file, not the output. -->
<style>
  :root {
    --paper: #F6F6F3; --paper-2: #EFEFEA; --ink: #1B1A17; --ink-soft: #57554E;
    --ink-faint: #8B897F; --line: #D7D6CE; --accent: #223089; --accent-ink: #1A2568;
    --sans: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    --sans-wide: "Archivo Expanded", "Archivo", system-ui, sans-serif;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --gutter: clamp(1.25rem, 5vw, 6rem);
    --block-gap: clamp(3.5rem, 9vw, 7rem);
    --measure: 60ch;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  a { color: inherit; }
  ::selection { background: var(--accent); color: var(--paper); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  img, video { display: block; max-width: 100%; }
  code { font-size: 0.9em; background: var(--paper-2); padding: 0.05em 0.3em; }
  .wrap { max-width: 1180px; margin-inline: auto; padding-inline: var(--gutter); }

  /* masthead (same as homepage) */
  .masthead { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .masthead .wrap { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; padding-block: 1.05rem; }
  .mark { font-family: var(--sans-wide); font-weight: 700; letter-spacing: -0.01em; font-size: 1.02rem; text-decoration: none; }
  .back { font-size: 0.9rem; font-weight: 500; color: var(--ink-soft); text-decoration: none; }
  .back:hover { color: var(--ink); }

  .block { padding-top: var(--block-gap); }
  .block-title { font-family: var(--sans-wide); font-weight: 700; font-size: clamp(1.15rem, 2.4vw, 1.55rem); margin: 0 0 2rem; border-top: 1px solid var(--ink); padding-top: 0.85rem; letter-spacing: -0.01em; }

  /* 1. hook */
  .eyebrow { font-size: clamp(0.95rem, 1.4vw, 1.08rem); font-weight: 600; color: var(--ink-soft); margin: 0 0 1.4rem; max-width: 46ch; line-height: 1.35; }
  .hook { font-family: var(--sans-wide); font-weight: 800; font-size: clamp(2rem, 6vw, 4rem); line-height: 1.03; letter-spacing: -0.02em; margin: 0; max-width: 17ch; }

  /* 2. insight */
  .insight { font-family: var(--serif); font-size: clamp(1.2rem, 2vw, 1.45rem); line-height: 1.6; max-width: var(--measure); border-top: 1px solid var(--ink); padding-top: 1.4rem; }
  .insight p { margin: 0 0 1em; }
  .insight p:last-child { margin-bottom: 0; }

  /* 3. visual payoff */
  .payoff { background: var(--ink); color: var(--paper); margin-top: var(--block-gap); padding-block: clamp(3rem, 7vw, 5.5rem); }
  .payoff-intro { margin: 0 0 2rem; max-width: 52ch; font-size: 1.05rem; color: color-mix(in srgb, var(--paper) 80%, transparent); }
  .payoff a { color: var(--paper); }
  .hero-media { margin: 0; }
  .hero-media img, .hero-media video { width: 100%; height: auto; }
  .hero-media figcaption, .frame figcaption { font-size: 0.78rem; color: color-mix(in srgb, var(--paper) 60%, transparent); padding-top: 0.45rem; }
  .sheet { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(0.5rem, 1.2vw, 0.9rem); }
  @media (min-width: 720px)  { .sheet { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width: 1040px) { .sheet { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .frame { margin: 0; display: flex; flex-direction: column; }
  .frame button { all: unset; display: block; width: 100%; cursor: zoom-in; position: relative; background: #2a2925; overflow: hidden; }
  .frame button { flex: 1 1 auto; }
  .frame img, .frame video { width: 100%; height: 100%; object-fit: cover; transition: transform .35s ease; }
  .frame button:hover img { transform: scale(1.03); }
  .frame button:focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; }
  /* a frame titled "wide" spans two columns and fills the row height */
  .frame.wide { grid-column: span var(--span-2, 2); }
  @media (min-width: 720px)  { .frame.wide { grid-column: span var(--span-3, 2); } }
  @media (min-width: 1040px) { .frame.wide { grid-column: span var(--span-4, 2); } }
  .frame.wide button { aspect-ratio: 2 / 1; }
  .frame.wide img { position: absolute; inset: 0; }
  /* carousel layout (layout: carousel) — a swipeable row of slides */
  .carousel .track { display: grid; grid-auto-flow: column; grid-auto-columns: min(82%, 23rem); gap: clamp(0.6rem, 1.4vw, 1rem);
    overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: 0; padding-bottom: 0.8rem; scrollbar-width: thin; scrollbar-color: #57554E transparent; }
  @media (min-width: 720px)  { .carousel .track { grid-auto-columns: calc((100% - 1.4rem) / 2.35); } }
  @media (min-width: 1040px) { .carousel .track { grid-auto-columns: calc((100% - 2.2rem) / 2.6); } }
  .carousel .frame { scroll-snap-align: start; }
  .carousel .track:focus-visible { outline: 2px solid var(--paper); outline-offset: 4px; }
  .car-nav { display: flex; align-items: center; gap: 0.9rem; margin-top: 0.9rem; }
  .car-nav button { all: unset; cursor: pointer; width: 2.6rem; height: 2.6rem; display: grid; place-items: center; border: 1px solid color-mix(in srgb, var(--paper) 40%, transparent); font-size: 1.05rem; }
  .car-nav button:hover, .car-nav button:focus-visible { border-color: var(--paper); }
  .car-nav button[disabled] { opacity: 0.3; cursor: default; }
  .car-count { font-size: 0.85rem; color: color-mix(in srgb, var(--paper) 65%, transparent); font-variant-numeric: tabular-nums; }

  /* phone demo: a playable page in a phone frame, rest of the payoff beside it */
  .demo { display: grid; gap: 2.2rem; }
  @media (min-width: 900px) { .demo { grid-template-columns: 380px minmax(0, 1fr); gap: 3.2rem; align-items: start; } }
  .phone-frame { margin: 0 auto; width: min(100%, 380px); }
  .phone { padding: 11px; border-radius: 46px; background: #34322d; box-shadow: inset 0 0 0 1px rgba(246,246,243,0.16), 0 24px 60px rgba(0,0,0,0.35); }
  .phone iframe { display: block; width: 100%; aspect-ratio: 9 / 19; border: 0; border-radius: 36px; background: #fff; }
  .phone-frame figcaption { text-align: center; font-size: 0.78rem; color: color-mix(in srgb, var(--paper) 60%, transparent); padding-top: 0.7rem; }
  .demo-side .hero-media { margin-top: 0; }
  .demo-side .cta-row { margin-top: 1.6rem; }
  .more-links { list-style: none; margin: 1.2rem 0 0; padding: 0; flex-basis: 100%; font-size: 0.9rem; }
  .more-links li { padding: 0.5rem 0; border-top: 1px solid color-mix(in srgb, var(--paper) 18%, transparent); color: color-mix(in srgb, var(--paper) 62%, transparent); }
  .more-links li:last-child { border-bottom: 1px solid color-mix(in srgb, var(--paper) 18%, transparent); }
  .more-links a { color: var(--paper); font-weight: 600; text-decoration: none; }
  .more-links a:hover { text-decoration: underline; }

  /* a tile built in HTML (e.g. an end card): fills whatever cell shape it lands in */
  .tile-html { flex: 1 1 auto; min-height: 15rem; display: flex; container-type: inline-size; }
  .tile-html > * { flex: 1; }
  .payoff-caption p { margin: 1.1rem 0 0; font-size: 0.85rem; font-style: italic; color: color-mix(in srgb, var(--paper) 62%, transparent); max-width: 70ch; }
  @media (prefers-reduced-motion: reduce) { .frame img { transition: none; } }
  .cta-row { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-top: 2.2rem; }
  .cta-row:empty { display: none; }
  .cta { display: inline-flex; align-items: center; text-decoration: none; font-weight: 600; font-size: 0.98rem; padding: 0.9rem 1.3rem; }
  .cta.primary { background: var(--paper); color: var(--ink) !important; }
  .cta.primary:hover { background: #fff; }
  .cta.ghost { border: 1px solid color-mix(in srgb, var(--paper) 40%, transparent); }
  .cta.ghost:hover { border-color: var(--paper); }

  dialog.lightbox { border: 0; padding: 0; background: transparent; max-width: min(92vw, 1100px); max-height: 92vh; }
  dialog.lightbox::backdrop { background: rgba(15, 14, 12, 0.9); }
  dialog.lightbox img { max-width: 100%; max-height: 82vh; width: auto; margin-inline: auto; }
  .lb-bar { display: flex; align-items: center; gap: 0.6rem; color: var(--paper); font-size: 0.85rem; padding-top: 0.7rem; }
  .lb-bar span { flex: 1; text-align: center; }
  .lb-bar button { all: unset; cursor: pointer; padding: 0.3rem 0.6rem; border: 1px solid rgba(246,246,243,0.35); }
  .lb-bar button:hover, .lb-bar button:focus-visible { border-color: var(--paper); }

  /* 4. how it works */
  .steps-intro { margin: -1rem 0 1.8rem; color: var(--ink-soft); }
  .steps { list-style: none; counter-reset: step; margin: 0; padding: 0; }
  .steps li { counter-increment: step; display: grid; grid-template-columns: 3rem minmax(0, 1fr); gap: 0 1rem; padding: 1.2rem 0; border-top: 1px solid var(--line); }
  .steps li:first-child { border-top: none; padding-top: 0; }
  .steps li::before { content: counter(step, decimal-leading-zero); font-family: var(--sans-wide); font-weight: 700; color: var(--accent); }
  .steps li div { color: var(--ink-soft); max-width: 58ch; }
  .steps strong { color: var(--ink); font-weight: 600; }

  /* 5. what I learned + stack */
  .closing { display: grid; gap: 2.5rem; }
  @media (min-width: 860px) { .closing { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 4rem; } }
  .learned { font-family: var(--serif); font-size: 1.15rem; line-height: 1.62; max-width: var(--measure); }
  .learned p { margin: 0 0 1em; }
  .learned p:last-child { margin-bottom: 0; }
  .meta h3 { font-size: 0.82rem; font-weight: 600; color: var(--ink-faint); margin: 0 0 0.6rem; }
  .stack { list-style: none; margin: 0 0 1.8rem; padding: 0; display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .stack li { border: 1px solid var(--line); padding: 0.3rem 0.65rem; font-size: 0.88rem; }
  .stack-note { margin: -1rem 0 1.6rem; font-size: 0.88rem; color: var(--ink-soft); }
  .code-link { display: inline-block; font-weight: 600; color: var(--accent); text-decoration: none; border-bottom: 1px solid currentColor; padding-bottom: 1px; }
  .code-link:hover { color: var(--accent-ink); }

  footer { margin-top: var(--block-gap); border-top: 1px solid var(--ink); padding-block: 2rem 3rem; font-size: 0.85rem; }
  footer a { color: var(--ink-soft); }
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <a href="../../" class="mark">Ori Feinberg</a>
    <a href="../../#work" class="back">All work</a>
  </div>
</header>

<main>
  <!-- 1. Hook -->
  <section class="block" aria-labelledby="hook">
    <div class="wrap">
      <p class="eyebrow">{{HEADING}}</p>
      <h1 class="hook" id="hook">{{HOOK}}</h1>
    </div>
  </section>

  <!-- 2. Insight -->
  <section class="block" aria-label="The insight">
    <div class="wrap"><div class="insight">{{INSIGHT}}</div></div>
  </section>

  <!-- 3. Visual payoff -->
  <section class="payoff" aria-label="The output">
    <div class="wrap">
      <p class="payoff-intro">{{PAYOFF_INTRO}}</p>
      {{PAYOFF}}
      <div class="payoff-caption">{{PAYOFF_CAPTION}}</div>
      <div class="cta-row">{{CTAS}}</div>
    </div>
  </section>

  <dialog class="lightbox" id="lightbox" aria-label="Enlarged image">
    <img id="lb-img" alt="" />
    <div class="lb-bar">
      <button type="button" id="lb-prev">Previous</button>
      <span id="lb-cap"></span>
      <button type="button" id="lb-next">Next</button>
      <button type="button" id="lb-close">Close</button>
    </div>
  </dialog>

  <!-- 4. How it works -->
  <section class="block" aria-labelledby="how-h">
    <div class="wrap">
      <h2 class="block-title" id="how-h">How it works</h2>
      {{STEPS_INTRO}}
      <ol class="steps">{{STEPS}}</ol>
    </div>
  </section>

  <!-- 5. What I learned + stack -->
  <section class="block" aria-labelledby="learned-h">
    <div class="wrap">
      <h2 class="block-title" id="learned-h">What I learned</h2>
      <div class="closing">
        <div class="learned">{{LEARNED}}</div>
        <div class="meta">
          <h3>Built with</h3>
          <ul class="stack">{{STACK}}</ul>
          {{STACK_NOTE}}
          {{CODE}}
        </div>
      </div>
    </div>
  </section>
</main>

<footer><div class="wrap"><a href="../../#work">Back to all work</a></div></footer>

<script>
  // Carousel: prev/next buttons step one slide; counter follows scrolling.
  (function () {
    var car = document.querySelector('.carousel'); if (!car) return;
    var track = car.querySelector('.track'), frames = track.querySelectorAll('.frame');
    var prev = car.querySelector('.car-prev'), next = car.querySelector('.car-next'), count = car.querySelector('.car-count');
    function step() { return frames.length > 1 ? frames[1].offsetLeft - frames[0].offsetLeft : track.clientWidth; }
    function current() { return Math.round(track.scrollLeft / step()); }
    function update() {
      var i = current(), atEnd = track.scrollLeft + track.clientWidth >= track.scrollWidth - 2;
      count.textContent = (atEnd ? frames.length : i + 1) + ' / ' + frames.length;
      prev.disabled = track.scrollLeft <= 2; next.disabled = atEnd;
    }
    var motion = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
    prev.addEventListener('click', function () { track.scrollBy({ left: -step(), behavior: motion }); });
    next.addEventListener('click', function () { track.scrollBy({ left: step(), behavior: motion }); });
    track.addEventListener('scroll', function () { window.requestAnimationFrame(update); }, { passive: true });
    window.addEventListener('resize', update); update();
  })();

  // Lightbox for multi-image payoffs: click to enlarge, arrows/buttons to step, Esc closes.
  (function () {
    var buttons = Array.prototype.slice.call(document.querySelectorAll('#sheet .frame button'));
    var dlg = document.getElementById('lightbox');
    if (!buttons.length || !dlg || !dlg.showModal) return;
    var img = document.getElementById('lb-img'), cap = document.getElementById('lb-cap'), i = 0;
    function show(n) {
      i = (n + buttons.length) % buttons.length;
      var el = buttons[i].querySelector('img');
      if (!el) return;
      img.src = el.currentSrc || el.src; img.alt = el.alt;
      cap.textContent = buttons[i].parentNode.querySelector('figcaption').textContent;
    }
    buttons.forEach(function (b, n) { b.addEventListener('click', function () { show(n); dlg.showModal(); }); });
    document.getElementById('lb-prev').addEventListener('click', function () { show(i - 1); });
    document.getElementById('lb-next').addEventListener('click', function () { show(i + 1); });
    document.getElementById('lb-close').addEventListener('click', function () { dlg.close(); });
    dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
    dlg.addEventListener('keydown', function (e) { if (e.key === 'ArrowRight') show(i + 1); if (e.key === 'ArrowLeft') show(i - 1); });
  })();
</script>
</body>
</html>
